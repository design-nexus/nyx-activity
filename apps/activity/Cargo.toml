[package]
name = "nyx-activity"
version = "0.1.0"
description = "A task manager for Omarchy: processes, live performance graphs, startup items and services"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-activity"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-activity"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "8454ac9e6e10a22872b079be0893cf41406c4d11" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "8454ac9e6e10a22872b079be0893cf41406c4d11" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
